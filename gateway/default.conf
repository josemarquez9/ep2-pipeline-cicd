# =============================================================================
# Gateway (nginx-unprivileged): único punto de entrada hacia los microservicios.
#
# - Docker resuelve "productos" y "reportes" a TODAS las réplicas del servicio
#   (DNS round-robin). Con "resolver" + variables, nginx vuelve a resolver los
#   nombres cada 5 s: detecta réplicas nuevas (docker compose up --scale) sin reiniciarse.
# - Solo se publican las rutas /api/*, /info/* y /health. Lo demás (p. ej. /actuator/*) devuelve 404.
# =============================================================================

resolver 127.0.0.11 valid=5s ipv6=off;

# Límite de peticiones por IP (protección básica contra abuso)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

# Log con identificador de petición y réplica que atendió (trazabilidad extremo a extremo)
log_format trace '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                 'rid=$request_id upstream=$upstream_addr rt=$request_time';

server {
    listen 8080;
    server_name _;

    server_tokens off;
    access_log /var/log/nginx/access.log trace;

    limit_req zone=api_limit burst=100 nodelay;
    limit_req_status 429;
    client_max_body_size 1m;

    # Parámetros comunes del proxy (se heredan en cada location)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    add_header X-Request-ID $request_id always;

    # Salud del propio gateway
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","component":"gateway"}';
    }

    # Trazabilidad: versión y commit de cada microservicio desplegado
    location = /info/productos {
        set $destino http://productos:8081/actuator/info;
        proxy_pass $destino;
    }

    location = /info/reportes {
        set $destino http://reportes:8000/info;
        proxy_pass $destino;
    }

    # API de negocio
    location ^~ /api/productos {
        set $destino http://productos:8081;
        proxy_pass $destino;
    }

    location ^~ /api/reportes {
        set $destino http://reportes:8000;
        proxy_pass $destino;
    }

    # Cualquier otra ruta NO se expone
    location / {
        default_type application/json;
        return 404 '{"error":"Recurso no encontrado"}';
    }
}
