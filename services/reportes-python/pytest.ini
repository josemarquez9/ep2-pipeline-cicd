[pytest]
testpaths = tests
pythonpath = .
# Política de calidad: cobertura mínima del 80 % (el pipeline puede sobrescribirla con --cov-fail-under)
addopts =
    -ra
    --cov=app
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-report=html:htmlcov
    --cov-fail-under=80
    --junitxml=reports/junit.xml
